name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --junitxml=junit.xml
      - name: Annotate test failures
        if: failure()
        run: python .github/scripts/annotate_junit.py
      - name: Validate example configs
        run: |
          traintraintrain -c examples/train.yaml plan
          traintraintrain -c examples/pipeline/train.yaml connectors list
          traintraintrain -c examples/databricks/train.yaml connectors list
          traintraintrain -c examples/jira/train.yaml connectors list
          traintraintrain -c examples/test-connections/train.yaml connectors list
          traintraintrain -c examples/driver/train.yaml plan


  postgres:
    name: test with Postgres (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,postgres]"
      - name: Run the whole suite, including the Postgres tests
        run: python -m pytest -q --junitxml=junit.xml -rs
      - name: Postgres tests must not be skipped
        run: python -m pytest -q tests/test_postgres.py -rs | tee pg.txt && ! grep -q "skipped" pg.txt
      - name: Annotate test failures
        if: failure()
        run: python .github/scripts/annotate_junit.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel contains the web UI and the typing marker
        run: |
          unzip -l dist/*.whl | grep -q "traintraintrain/ui/index.html"
          unzip -l dist/*.whl | grep -q "traintraintrain/py.typed"
      - name: Sdist contains the tests, docs and license
        run: |
          tar tzf dist/*.tar.gz | grep -q "/tests/test_traintraintrain.py"
          tar tzf dist/*.tar.gz | grep -q "/docs/configuration.md"
          tar tzf dist/*.tar.gz | grep -q "/LICENSE"
      - name: The installed wheel works (not just the source tree)
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/traintraintrain -c "$GITHUB_WORKSPACE/examples/pipeline/train.yaml" connectors list
          /tmp/wheel-env/bin/traintraintrain -c "$GITHUB_WORKSPACE/examples/train.yaml" plan
          expected=$(python -c "import tomllib; print(tomllib.load(open('$GITHUB_WORKSPACE/pyproject.toml','rb'))['project']['version'])")
          test "$(/tmp/wheel-env/bin/traintraintrain --version)" = "traintraintrain $expected"
